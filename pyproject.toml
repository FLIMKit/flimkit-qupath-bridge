[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'flimkit-qupath-bridge'
version = '0.3.0'
description = 'Direct image and ROI exchange between FLIMKit and QuPath'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE.md']
authors = [
    {name = 'Alex Hunt', email = 'alexander.hunt@ed.ac.uk'},
]
keywords = ['FLIM', 'FLIMKit', 'QuPath', 'ImageJ', 'plugin']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Image Processing',
]
dependencies = [
    'flimkit>=0.12.0',
    'numpy',
    'tifffile',
]

[project.optional-dependencies]
test = ['pytest']

[project.scripts]
flimkit-bridge = 'flimkit_qupath_bridge.headless:main'

[project.urls]
Homepage = 'https://github.com/FLIMKit/flimkit-qupath-bridge'
Issues = 'https://github.com/FLIMKit/flimkit-qupath-bridge/issues'

[project.entry-points.'flimkit.plugins']
qupath_bridge = 'flimkit_qupath_bridge'

[tool.setuptools.packages.find]
include = ['flimkit_qupath_bridge*']
