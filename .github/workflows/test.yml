name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FLIMKit
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps 'flimkit @ git+https://github.com/FLIMKit/FLIMKit'

      - name: Install the add-on
        run: |
          pip install -e '.[test]'
          pip install pytest-timeout

      - name: Run tests
        run: pytest -q --timeout=120 --timeout-method=thread

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build the QuPath extension
        working-directory: qupath-extension
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: qupath-extension-jar
          path: qupath-extension/build/libs/*.jar
