name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build the QuPath extension
        working-directory: qupath-extension
        run: ./gradlew build --no-daemon

      - name: Build the Python add-on
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Collect the release files
        run: |
          mkdir -p release
          cp qupath-extension/build/libs/qupath-extension-flimkit-bridge-*.jar release/
          rm -f release/*-sources.jar
          cp dist/*.whl dist/*.tar.gz release/
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Two halves, one on each side.

            The Python half comes from PyPI, into the environment FLIMKit runs in:

            ```
            pip install flimkit-qupath-bridge
            ```

            That pulls FLIMKit with it. The bridge then starts with FLIMKit and adds a `Send to QuPath` button to the ROI panel. `flimkit-bridge` is on the path as well, for the server without the FLIMKit window.

            The wheel and sdist are attached below for anyone installing offline, or into `~/.flimkit/plugins/`.

            **QuPath extension**: drop `qupath-extension-flimkit-bridge-*.jar` into QuPath's extensions directory, normally `~/QuPath/v0.7/extensions`. It appears under `Extensions > FLIMKit bridge`.

            Co-registration needs the [QuPath alignment extension](https://github.com/qupath/qupath-extension-align), which QuPath does not ship. Without it you can still exchange images and ROIs, but only between images that already share a coordinate system.

            Requires QuPath 0.7.0 or newer, Python 3.12 or newer, and FLIMKit 0.13.0 or newer.
